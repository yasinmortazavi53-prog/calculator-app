<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ماشین حساب سه تمه – روشن | تاریک | نئون</title>
    <meta name="description" content="ماشین حساب فارسی با سه تم زیبا: روشن، تاریک و نئون">
    <!-- PWA / Android -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#764ba2">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Calculator Pro">
    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="css/style.css">
    <!-- فوری: جلوگیری از فلش تم -->
    <script>
      (function(){
        try {
          var t = localStorage.getItem('calc-theme') || 
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', t);
        } catch(e){}
      })();
    </script>
</head>
<body>
    <!-- دکمه تغییر سریع تم (اختیاری، برای موبایل) -->
    <button class="quick-toggle" id="quickToggle" aria-label="تغییر تم">تغییر تم → روشن</button>

    <div class="app-wrapper">
        <!-- Theme Switcher -->
        <div class="theme-switcher" role="group" aria-label="انتخاب تم">
            <button class="theme-btn" data-theme="light" aria-pressed="false">
                <span class="icon">☀️</span>
                <span>روشن</span>
            </button>
            <button class="theme-btn active" data-theme="dark" aria-pressed="true">
                <span class="icon">🌙</span>
                <span>تاریک</span>
            </button>
            <button class="theme-btn" data-theme="neon" aria-pressed="false">
                <span class="icon">⚡</span>
                <span>نئون</span>
            </button>
        </div>
        <div class="theme-label">
            تم فعلی: <strong id="currentThemeLabel">تاریک</strong>
            · میانبر <kbd>Ctrl</kbd>+<kbd>T</kbd>
        </div>

        <!-- Calculator -->
        <div class="calculator">
            <div class="brand">
                <span class="brand-title">Calculator Pro</span>
                <span><span class="live-dot"></span>لایو</span>
            </div>

            <div class="display-wrap">
                <div id="expression">&nbsp;</div>
                <input type="text" id="display" readonly placeholder="0" autocomplete="off" aria-label="نمایشگر ماشین حساب">
            </div>
            
            <div class="buttons">
                <button class="calc-btn clear" onclick="clearDisplay()" aria-label="پاک کردن">C</button>
                <button class="calc-btn delete" onclick="deleteLast()" aria-label="حذف">⌫</button>
                <button class="calc-btn operator" onclick="appendToDisplay('%')" aria-label="درصد">%</button>
                <button class="calc-btn operator" onclick="appendToDisplay('/')" aria-label="تقسیم">÷</button>
                
                <button class="calc-btn number" onclick="appendToDisplay('7')">7</button>
                <button class="calc-btn number" onclick="appendToDisplay('8')">8</button>
                <button class="calc-btn number" onclick="appendToDisplay('9')">9</button>
                <button class="calc-btn operator" onclick="appendToDisplay('*')" aria-label="ضرب">×</button>
                
                <button class="calc-btn number" onclick="appendToDisplay('4')">4</button>
                <button class="calc-btn number" onclick="appendToDisplay('5')">5</button>
                <button class="calc-btn number" onclick="appendToDisplay('6')">6</button>
                <button class="calc-btn operator" onclick="appendToDisplay('-')" aria-label="منها">−</button>
                
                <button class="calc-btn number" onclick="appendToDisplay('1')">1</button>
                <button class="calc-btn number" onclick="appendToDisplay('2')">2</button>
                <button class="calc-btn number" onclick="appendToDisplay('3')">3</button>
                <button class="calc-btn operator" onclick="appendToDisplay('+')" aria-label="جمع">+</button>
                
                <button class="calc-btn number span-2" onclick="appendToDisplay('0')">0</button>
                <button class="calc-btn decimal" onclick="appendToDisplay('.')">.</button>
                <button class="calc-btn equals" onclick="calculate()" aria-label="مساوی">=</button>
            </div>

            <div class="hint">
                کیبورد فعال است · <kbd>Enter</kbd> مساوی · <kbd>Esc</kbd> پاک کردن · <kbd>Backspace</kbd> حذف
            </div>
        </div>

        <div class="hint" style="margin-top:4px; opacity:0.8">
            ۳ تم: 
            <span style="color:var(--text-main)">☀️ روشن</span> · 
            🌙 تاریک · 
            ⚡ نئون سایبرپانک
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
      // PWA Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(()=>{});
        });
      }
    </script>
</body>
</html>
