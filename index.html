<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="calculator" aria-label="Calculator">
        <output class="display" id="display">0</output>

        <div class="buttons">
            <button type="button" class="btn btn-clear" data-action="clear">C</button>
            <button type="button" class="btn btn-delete" data-action="delete">&#9003;</button>
            <button type="button" class="btn btn-operator" data-operation="/">÷</button>
            <button type="button" class="btn btn-operator" data-operation="*">×</button>

            <button type="button" class="btn btn-digit" data-digit="7">7</button>
            <button type="button" class="btn btn-digit" data-digit="8">8</button>
            <button type="button" class="btn btn-digit" data-digit="9">9</button>
            <button type="button" class="btn btn-operator" data-operation="-">&minus;</button>

            <button type="button" class="btn btn-digit" data-digit="4">4</button>
            <button type="button" class="btn btn-digit" data-digit="5">5</button>
            <button type="button" class="btn btn-digit" data-digit="6">6</button>
            <button type="button" class="btn btn-operator" data-operation="+">+</button>

            <button type="button" class="btn btn-digit" data-digit="1">1</button>
            <button type="button" class="btn btn-digit" data-digit="2">2</button>
            <button type="button" class="btn btn-digit" data-digit="3">3</button>
            <button type="button" class="btn btn-equals" data-action="equals">=</button>

            <button type="button" class="btn btn-digit btn-zero" data-digit="0">0</button>
            <button type="button" class="btn btn-digit" data-action="decimal">.</button>
        </div>
    </main>

    <script src="js/calculator.js"></script>
</body>
</html>
